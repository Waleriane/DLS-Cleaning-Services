<style>
/* =========================================
   JANELA DE DETALHES DOS SERVIÇOS
========================================= */
.svm{ position:fixed; inset:0; z-index:5000; display:none; align-items:center; justify-content:center; padding:20px;
  background:rgba(4,47,59,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); font-family:'Montserrat',Arial,sans-serif; }
.svm.open{ display:flex; animation:svmFade .25s ease; }
@keyframes svmFade{ from{ opacity:0; } to{ opacity:1; } }
.svm *{ box-sizing:border-box; margin:0; padding:0; }
.svm-box{ position:relative; width:min(760px,100%); max-height:90vh; overflow-y:auto; background:#fff; border-radius:14px;
  box-shadow:0 30px 80px rgba(4,47,59,.3); display:grid; grid-template-columns:42% 58%; animation:svmUp .3s ease; }
@keyframes svmUp{ from{ transform:translateY(16px); } to{ transform:none; } }
.svm-media{ position:relative; min-height:100%; background:#DDF2F2; }
.svm-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.svm-body{ padding:34px 32px 30px; color:#063B4A; }
.svm-close{ position:absolute; top:12px; right:12px; z-index:2; width:40px; height:40px; border-radius:50%; border:0; cursor:pointer;
  background:#fff; color:#063B4A; font-size:22px; line-height:1; box-shadow:0 4px 14px rgba(6,59,74,.15); }
.svm-close:hover{ background:#0D9FA5; color:#fff; }
.svm-eyebrow{ color:#0D9FA5; font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
.svm-title{ font-family:'DM Serif Display',Georgia,serif; font-weight:400; font-size:34px; line-height:1.08; margin-bottom:12px; }
.svm-text{ color:#3B4F55; font-size:15px; line-height:1.75; }
.svm-list-title{ margin-top:20px; margin-bottom:10px; font-size:12px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:#063B4A; }
.svm-list{ list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:9px 16px; }
.svm-list li{ position:relative; padding-left:26px; font-size:14px; line-height:1.45; color:#063B4A; font-weight:500; }
.svm-list li::before{ content:"✓"; position:absolute; left:0; top:0; width:18px; height:18px; border-radius:50%; background:#DDF2F2; color:#0D9FA5;
  font-size:11px; font-weight:700; display:grid; place-items:center; }
.svm-list.steps{ grid-template-columns:1fr; counter-reset:step; }
.svm-list.steps li{ counter-increment:step; }
.svm-list.steps li::before{ content:counter(step); background:#0D9FA5; color:#fff; }
.svm-note{ margin-top:18px; padding:12px 14px; background:#F2F8F8; border-left:3px solid #0D9FA5; border-radius:6px; font-size:13.5px; line-height:1.6; color:#3B4F55; }
.svm-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:12px 18px; margin-top:22px; }
.svm-cta{ display:inline-flex; align-items:center; gap:10px; min-height:46px; padding:0 22px; border-radius:6px; background:#0D9FA5; color:#fff;
  text-decoration:none; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
.svm-cta:hover{ background:#063B4A; }
.svm-more{ color:#0D9FA5; font-size:13px; font-weight:700; text-decoration:none; }
.svm-more:hover{ text-decoration:underline; }
@media (max-width:700px){
  .svm{ padding:0; align-items:flex-end; }
  .svm-box{ grid-template-columns:1fr; max-height:92vh; border-radius:18px 18px 0 0; }
  .svm-media{ height:170px; min-height:0; }
  .svm-body{ padding:24px 20px 26px; }
  .svm-title{ font-size:29px; }
  .svm-list{ grid-template-columns:1fr; }
  .svm-cta{ width:100%; justify-content:center; }
}
</style>

<div class="svm" id="dlsSvcModal" role="dialog" aria-modal="true" aria-label="Service details">
  <div class="svm-box">
    <button class="svm-close" type="button" aria-label="Close">×</button>
    <div class="svm-media"><img class="svm-img" src="" alt=""></div>
    <div class="svm-body">
      <div class="svm-eyebrow"></div>
      <h3 class="svm-title"></h3>
      <p class="svm-text"></p>
      <div class="svm-list-title"></div>
      <ul class="svm-list"></ul>
      <p class="svm-note"></p>
      <div class="svm-actions">
        <a class="svm-cta" href="#quote">Request a Free Estimate <span>→</span></a>
        <a class="svm-more" href="#"></a>
      </div>
    </div>
  </div>
</div>
<script src="js/servicos.js"></script>
