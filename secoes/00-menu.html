<style>
/* =========================================
   MENU DO TOPO (fixo ao rolar)
========================================= */
html{ scroll-padding-top:86px; }
.dls-header{
  position:sticky; top:0; z-index:1000;
  background:rgba(255,255,255,.96);
  backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid rgba(6,59,74,.08);
  font-family:'Montserrat',Arial,sans-serif;
  transition:box-shadow .3s ease;
}
.dls-header.scrolled{ box-shadow:0 8px 30px rgba(6,59,74,.08); }
.dls-header *{ box-sizing:border-box; margin:0; padding:0; }
.hd-wrap{ max-width:1440px; margin:0 auto; padding:0 3vw; height:84px; display:flex; align-items:center; gap:28px; }
.hd-logo{ display:flex; align-items:center; flex:none; }
.hd-logo img{ height:62px; width:auto; display:block; }

.hd-nav{ display:flex; align-items:center; gap:4px; margin:0 auto; }
.hd-nav a{
  position:relative; padding:10px 14px; color:#063B4A; text-decoration:none;
  font-size:13px; font-weight:600; letter-spacing:.02em; white-space:nowrap; transition:color .2s ease;
}
.hd-nav a::after{
  content:""; position:absolute; left:14px; right:14px; bottom:4px; height:2px; background:#0D9FA5;
  transform:scaleX(0); transform-origin:left; transition:transform .25s ease;
}
.hd-nav a:hover, .hd-nav a.active{ color:#0D9FA5; }
.hd-nav a:hover::after, .hd-nav a.active::after{ transform:scaleX(1); }

.hd-icons{ display:flex; align-items:center; gap:8px; flex:none; }
.hd-icon{
  width:40px; height:40px; border-radius:50%; display:grid; place-items:center;
  border:1px solid rgba(13,159,165,.35); color:#0D9FA5; background:#fff; transition:.25s ease;
}
.hd-icon svg{ width:18px; height:18px; }
.hd-icon:hover{ background:#0D9FA5; color:#fff; border-color:#0D9FA5; transform:translateY(-2px); }

.hd-burger{ display:none; width:44px; height:44px; border:1px solid rgba(6,59,74,.15); border-radius:10px; background:#fff; cursor:pointer;
  flex-direction:column; align-items:center; justify-content:center; gap:5px; }
.hd-burger span{ display:block; width:20px; height:2px; background:#063B4A; border-radius:2px; transition:.3s ease; }
.dls-header.open .hd-burger span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.dls-header.open .hd-burger span:nth-child(2){ opacity:0; }
.dls-header.open .hd-burger span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }

/* menu do celular (abre ao tocar no ☰) */
.hd-mobile{ display:none; }

@media (max-width:1180px){
  .hd-nav a{ padding:10px 9px; font-size:12.5px; }
  .hd-nav a::after{ left:9px; right:9px; }
}
@media (max-width:1020px){
  .hd-wrap{ height:68px; }
  .hd-logo img{ height:44px; }
  .hd-nav{ display:none; }
  .hd-icons{ margin-left:auto; }
  .hd-burger{ display:flex; }
  .hd-mobile{
    display:block; max-height:0; overflow:hidden; background:#fff; transition:max-height .35s ease;
    border-top:1px solid transparent;
  }
  .dls-header.open .hd-mobile{ max-height:480px; border-top-color:rgba(6,59,74,.08); }
  .hd-mobile a.hd-mlink{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 6vw; color:#063B4A; text-decoration:none; font-size:16px; font-weight:600;
    border-bottom:1px solid rgba(6,59,74,.06);
  }
  .hd-mobile a.hd-mlink::after{ content:"→"; color:#0D9FA5; }
  .hd-mobile .hd-mcta{ display:block; margin:16px 6vw 20px; text-align:center; background:#0D9FA5; color:#fff; text-decoration:none;
    padding:15px; border-radius:6px; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  html{ scroll-padding-top:74px; }
}
@media (max-width:520px){
  .hd-wrap{ gap:10px; }
  .hd-logo img{ height:38px; }
  .hd-icons{ gap:6px; }
  .hd-icon{ width:36px; height:36px; }
  .hd-icon svg{ width:16px; height:16px; }
  .hd-burger{ width:40px; height:40px; }
}
@media (max-width:370px){
}
</style>
